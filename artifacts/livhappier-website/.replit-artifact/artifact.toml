kind = "web"
previewPath = "/"
title = "LivHappier Apps"
version = "1.0.0"
id = "artifacts/livhappier-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19144

[services.development]
run = "pnpm --filter @workspace/livhappier-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/livhappier-website", "run", "build" ]
publicDir = "artifacts/livhappier-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19144"
BASE_PATH = "/"
